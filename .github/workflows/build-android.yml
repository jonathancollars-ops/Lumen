name: Android CI & APK Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (apk or app-bundle)'
        required: false
        default: 'apk'
        type: choice
        options:
          - apk
          - app-bundle
      run_tests:
        description: 'Run Test Suite Before Build'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify, Test & Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🔍 Strict TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: 🧪 Run Automated Test Harness
        if: ${{ github.event.inputs.run_tests != 'false' }}
        run: npm test

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔑 Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🔨 Build Android Standalone APK (Release)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" 2>&1 | tee ../gradle_build.log

      - name: 🛡️ Sign APK with Official Release Keystore (Google Play Protect Compliant)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "🔑 Preparing official release signature..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            
            RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*unaligned*" | head -n 1)
            if [ -n "$RAW_APK" ] && [ -f "$RAW_APK" ]; then
              echo "📦 Aligning and signing APK ($RAW_APK) with official release certificate..."
              BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
              APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
              ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
              
              $ZIPALIGN -c -v 4 "$RAW_APK" || {
                $ZIPALIGN -f -v 4 "$RAW_APK" aligned.apk
                mv aligned.apk "$RAW_APK"
              }
              
              $APKSIGNER sign --ks release.keystore \
                --ks-key-alias "${ANDROID_KEY_ALIAS:-lumen-release-key}" \
                --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
                --key-pass pass:"$ANDROID_KEY_PASSWORD" \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "$RAW_APK"
              
              echo "✅ Verifying production APK signature:"
              $APKSIGNER verify --verbose "$RAW_APK"
              rm -f release.keystore
              echo "🎉 Official production signature applied successfully!"
            fi
          else
            echo "ℹ️ ANDROID_KEYSTORE_BASE64 secret not set. Skipping custom signing (using standard build)."
          fi

      - name: 📋 Prepare Artifacts & Calculate Checksums
        id: prepare-artifact
        run: |
          mkdir -p build-output
          # Locate generated APK across android outputs
          APK_FILE=$(find android -name "*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            TARGET_APK="build-output/lumen-v3.7.0-standalone.apk"
            cp "$APK_FILE" "$TARGET_APK"
            echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
            
            # Generate SHA-256 Checksum
            cd build-output
            sha256sum lumen-v3.7.0-standalone.apk > SHA256SUMS.txt
            echo "APK generated successfully: $TARGET_APK"
            cat SHA256SUMS.txt
            cd ..
          else
            echo "❌ Error: APK output file not found!"
            find android -name "*.apk" || true
            exit 1
          fi

      - name: 📤 Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-v3.7.0-android-apk
          path: |
            build-output/lumen-v3.7.0-standalone.apk
            build-output/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: 📤 Upload Gradle Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: gradle_build.log
          if-no-files-found: ignore

      - name: 🏷️ Publish GitHub Release (On Main Branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.7.0-build-${{ github.run_number }}
          name: Lumen Acadêmico v3.7.0 (Build #${{ github.run_number }})
          files: |
            build-output/lumen-v3.7.0-standalone.apk
            build-output/SHA256SUMS.txt
          body_path: CHANGELOG.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Output GitHub Actions Job Summary
        if: always()
        run: |
          echo "### 🚀 Lumen 3.7.0 Android CI/CD Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: \`lumen-v3.7.0-android-apk\` (Standalone APK & SHA256SUMS.txt)" >> $GITHUB_STEP_SUMMARY
          echo "- **Typecheck**: \`npx tsc --noEmit\` (0 errors)" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: \`npm test\` (100% green)" >> $GITHUB_STEP_SUMMARY
          if [ -f gradle_build.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 📋 Gradle Exact Error:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            sed -n '/What went wrong:/,/BUILD FAILED/p' gradle_build.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 📋 Gradle Failed Tasks & Warnings:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "FAILED|FAILURE:|ERROR:|error:|e: " gradle_build.log | head -n 40 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
