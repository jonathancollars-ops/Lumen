name: Windows CI & Desktop Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run Test Suite Before Build'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify, Test & Build Windows Desktop (EXE & MSI)
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: 'AIzaSyA1V_bCASfJe3Ij9Hvjsv3o9WHDIqt_fqg'
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: 'lumen-app-academico.firebaseapp.com'
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: 'lumen-app-academico'
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: 'lumen-app-academico.firebasestorage.app'
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '505145390874'
      EXPO_PUBLIC_FIREBASE_APP_ID: '1:505145390874:web:364b5af0fcf4833a7d5ea3'
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: '505145390874-dsluagocjfj15rjso9nsbgc282d4nvv8.apps.googleusercontent.com'
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: '505145390874-jr3d95ph621voepch94fslvas08kqevi.apps.googleusercontent.com'
      EXPO_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
      GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      WINDOWS_SIGNING_ENABLED: ${{ vars.WINDOWS_SIGNING_ENABLED }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
      WINDOWS_CERTIFICATE_PROFILE: ${{ vars.WINDOWS_CERTIFICATE_PROFILE }}

    steps:
      - name: Verify Desktop OAuth Configuration Before Publishing
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EXPO_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID)) {
            throw 'Configure the repository variable GOOGLE_DESKTOP_CLIENT_ID with a Google Desktop app OAuth client before publishing Windows installers.'
          }
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_DESKTOP_CLIENT_SECRET)) {
            throw 'Configure the repository secret GOOGLE_DESKTOP_CLIENT_SECRET required by the Windows OAuth client before publishing installers.'
          }

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Windows Signing Configuration
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_ENABLED -eq 'true') {
            foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'WINDOWS_SIGNING_ENDPOINT', 'WINDOWS_SIGNING_ACCOUNT', 'WINDOWS_CERTIFICATE_PROFILE')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                throw "Configure repository variable $name before enabling Windows signing."
              }
            }
          } elseif ($env:WINDOWS_SIGNING_ENABLED -and $env:WINDOWS_SIGNING_ENABLED -ne 'false') {
            throw 'WINDOWS_SIGNING_ENABLED must be true or false.'
          } else {
            Write-Output '::warning::Windows signing is not enabled. Installers remain unsigned and may trigger SmartScreen.'
          }

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🦀 Setup Rust Toolchain (Stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: ⚡ Rust & Cargo Dependency Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 📦 Install NPM Dependencies
        shell: bash
        run: npm ci || npm install

      - name: Verify Release Version
        run: npm run version:check
        env:
          RELEASE_PLATFORM: windows
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Strict TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: 🧪 Run Automated Test Harness
        if: ${{ github.event.inputs.run_tests != 'false' }}
        run: npm test

      - name: 🌐 Build Web Frontend (Expo Export)
        run: npm run build:web

      - name: Verify Desktop OAuth Client in Exported App
        if: env.EXPO_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID != ''
        shell: pwsh
        run: |
          $bundledClient = Get-ChildItem -LiteralPath dist -Recurse -Filter '*.js' -File |
            Select-String -SimpleMatch -Pattern $env:EXPO_PUBLIC_GOOGLE_DESKTOP_CLIENT_ID -Quiet |
            Where-Object { $_ } | Select-Object -First 1
          if (-not $bundledClient) {
            throw 'Desktop OAuth client ID is missing from the exported app.'
          }

      - name: 🧪 Test Native Google OAuth Callback Server
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: 🔨 Build Tauri Desktop Executable & Installers (.exe & .msi)
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ env.WINDOWS_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request' && '--no-bundle' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate Windows Signing with Azure (OIDC)
        if: env.WINDOWS_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request'
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows Application Before Packaging
        if: env.WINDOWS_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.WINDOWS_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Signed Windows Application and Package Installers
        if: env.WINDOWS_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          ./scripts/verify_windows_signatures.ps1 -Path src-tauri/target/release/lumen.exe
          npm run tauri -- bundle --bundles nsis,msi --no-binary-patching --ci
          if ($LASTEXITCODE -ne 0) { throw 'Tauri installer packaging failed.' }

      - name: Sign Windows Installers
        if: env.WINDOWS_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.WINDOWS_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release\bundle
          files-folder-filter: exe,msi
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows Installer Signatures Before Publishing
        if: env.WINDOWS_SIGNING_ENABLED == 'true' && github.event_name != 'pull_request'
        shell: pwsh
        run: ./scripts/verify_windows_signatures.ps1 -Path src-tauri/target/release/bundle

      - name: 📋 Prepare Windows Artifacts & Calculate Checksums
        id: prepare-artifact
        shell: bash
        run: |
          mkdir -p build-windows-output
          APP_VER=$(node -p "require('./package.json').version")
          echo "app_version=$APP_VER" >> $GITHUB_OUTPUT

          # Extract version-specific release notes (clean summary without past versions)
          node scripts/extract_release_notes.js "$APP_VER" build-windows-output/RELEASE_NOTES.md

          echo "🔍 Searching for generated Windows bundles (.exe / .msi)..."
          
          # Copy NSIS setup and WiX MSI installers from target release bundle
          if [ -d "src-tauri/target/release/bundle" ]; then
            find src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp -v {} build-windows-output/ \;
          fi

          # Also include standalone portable executable if generated
          if [ -f "src-tauri/target/release/lumen.exe" ]; then
            cp -v "src-tauri/target/release/lumen.exe" "build-windows-output/lumen-v${APP_VER}-portable.exe"
          fi

          # Ensure canonical setup names for AppUpdateService priority matching (*-setup.exe and *.msi)
          SETUP_EXE=$(find build-windows-output -type f -name "*setup.exe" | head -n 1)
          if [ -n "$SETUP_EXE" ]; then
            cp -v "$SETUP_EXE" "build-windows-output/lumen-v${APP_VER}-x64-setup.exe"
          fi

          MSI_FILE=$(find build-windows-output -type f -name "*.msi" | head -n 1)
          if [ -n "$MSI_FILE" ]; then
            cp -v "$MSI_FILE" "build-windows-output/lumen-v${APP_VER}-x64.msi"
          fi

          # Verify that artifacts were collected
          if [ -z "$(ls -A build-windows-output 2>/dev/null)" ]; then
            echo "❌ Error: No Windows installers (.exe or .msi) found in src-tauri/target/release/bundle!"
            ls -la src-tauri/target/release/ || true
            exit 1
          fi

          echo "📦 Collected Windows artifacts:"
          ls -lh build-windows-output/

          # Calculate SHA-256 Checksums
          cd build-windows-output
          rm -f SHA256SUMS-windows.txt
          sha256sum * > SHA256SUMS-windows.txt
          echo ""
          echo "🔐 SHA-256 Checksums:"
          cat SHA256SUMS-windows.txt
          cd ..

      - name: 📤 Upload Windows Artifacts (EXE & MSI)
        uses: actions/upload-artifact@v4
        with:
          name: lumen-v${{ steps.prepare-artifact.outputs.app_version }}-windows-setup
          path: |
            build-windows-output/*
          retention-days: 30
          if-no-files-found: error

      - name: 🏷️ Publish GitHub Release (On Main Branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prepare-artifact.outputs.app_version }}
          name: Lumen v${{ steps.prepare-artifact.outputs.app_version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: |
            build-windows-output/*
          body_path: build-windows-output/RELEASE_NOTES.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Publish Official GitHub Release (On Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumen ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: |
            build-windows-output/*
          body_path: build-windows-output/RELEASE_NOTES.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Output GitHub Actions Job Summary
        if: always()
        shell: bash
        run: |
          echo "### 🪟 Lumen ${{ steps.prepare-artifact.outputs.app_version }} Windows Desktop CI/CD Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: \`windows-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: \`lumen-v${{ steps.prepare-artifact.outputs.app_version }}-windows-setup\` (.exe installer, .msi package, portable .exe)" >> $GITHUB_STEP_SUMMARY
          echo "- **Typecheck**: \`npx tsc --noEmit\` (0 errors)" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Web Build**: \`npm run build:web\` (Expo Metro Export)" >> $GITHUB_STEP_SUMMARY
          echo "- **Tauri Action**: \`tauri-apps/tauri-action@v0\`" >> $GITHUB_STEP_SUMMARY
          if [ -f build-windows-output/SHA256SUMS-windows.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### 🔐 SHA-256 Checksums:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat build-windows-output/SHA256SUMS-windows.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
