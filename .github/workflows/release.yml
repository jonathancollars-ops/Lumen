name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v3.0.0)'
        required: false
        default: 'v3.0.0'
        type: string
      release_notes:
        description: 'Custom Release Notes'
        required: false
        default: 'Lumen 3.0.0 Standalone Android APK Release'
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔍 Strict TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: 🧪 Run Automated Test Harness
        run: npm test

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔑 Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🔨 Build Android Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"

      - name: 🛡️ Sign APK with Official Release Keystore (Google Play Protect Compliant)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "🔑 Preparing official release signature..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            
            RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*unaligned*" | head -n 1)
            if [ -n "$RAW_APK" ] && [ -f "$RAW_APK" ]; then
              echo "📦 Aligning and signing APK ($RAW_APK) with official release certificate..."
              BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
              APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
              ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
              
              $ZIPALIGN -c -v 4 "$RAW_APK" || {
                $ZIPALIGN -f -v 4 "$RAW_APK" aligned.apk
                mv aligned.apk "$RAW_APK"
              }
              
              $APKSIGNER sign --ks release.keystore \
                --ks-key-alias "${ANDROID_KEY_ALIAS:-lumen-release-key}" \
                --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" \
                --key-pass pass:"$ANDROID_KEY_PASSWORD" \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                "$RAW_APK"
              
              echo "✅ Verifying production APK signature:"
              $APKSIGNER verify --verbose "$RAW_APK"
              rm -f release.keystore
              echo "🎉 Official production signature applied successfully!"
            fi
          else
            echo "ℹ️ ANDROID_KEYSTORE_BASE64 secret not set. Skipping custom signing (using standard build)."
          fi

      - name: 📦 Package Release Assets & Generate Checksums
        id: package-release
        run: |
          mkdir -p release-assets
          TAG="${{ github.ref_name || inputs.tag_name || 'v3.0.0' }}"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          
          # Find generated APK
          APK_SRC=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "❌ Fatal: Android APK build failed or output missing"
            exit 1
          fi
          
          APK_DEST="release-assets/lumen-${TAG}-android.apk"
          cp "$APK_SRC" "$APK_DEST"
          
          cd release-assets
          sha256sum "lumen-${TAG}-android.apk" > SHA256SUMS.txt
          echo "SHA256 Checksum generated:"
          cat SHA256SUMS.txt
          cd ..
          
          echo "apk_dest=$APK_DEST" >> $GITHUB_OUTPUT

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Lumen ${{ steps.package-release.outputs.tag_name }} Release"
          tag_name: ${{ steps.package-release.outputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/lumen-*-android.apk
            release-assets/SHA256SUMS.txt
          body: |
            ## 🌟 Lumen ${{ steps.package-release.outputs.tag_name }} — Academic Assistant & Productivity Suite

            ### 📱 Standalone Android APK Download
            - **Binary**: `lumen-${{ steps.package-release.outputs.tag_name }}-android.apk`
            - **Platform**: Android 6.0+ (API 23+)
            - **Integrity**: Verified with SHA-256 Checksums (`SHA256SUMS.txt`)

            ### ✨ Key Features & Architecture
            - **🎨 Multi-Theme Design System**: Dynamic contrast (WCAG AA > 4.5:1), Dark, AMOLED, and Light modes.
            - **⚡ Fluid Vertical Navigation**: Agenda screen with Next Activity hero card, interactive multi-dot calendar, and prioritized tasks.
            - **⏱️ Study & Focus Timer**: Synchronized Pomodoro countdown and free-form stopwatch mode with real-time XP accumulation.
            - **🤖 Lumen AI Tutor**: Dual-mode engine supporting offline 3-tier GGUF models and online Gemini/OpenAI tutoring with strict prompt isolation.
            - **🛡️ Security & Privacy Hardened**: SecureStore encrypted credential storage, XML prompt delimiters, zero hardcoded secrets.

            ---
            *Built automatically via GitHub Actions CI/CD.*

      - name: 📤 Upload Release Artifacts Backup
        uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ steps.package-release.outputs.tag_name }}-release-assets
          path: release-assets/
          retention-days: 60
